<!-- Global style overrides -->
<style>
/* Typography */
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  overflow-x: hidden;
}
p, li, td, th, input, button, select, textarea {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
h1, h2, h3, h4, h5, h6 {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  font-weight: 700;
  letter-spacing: -0.02em;
}
p { line-height: 1.75; color: #333; }

/* Masthead */
.masthead { background: #fff; border-bottom: 1px solid #e8e8e8; box-shadow: none; }
.greedy-nav { background: #fff; }
.greedy-nav a {
  font-family: 'Inter', sans-serif;
  font-size: 0.82rem;
  font-weight: 500;
  color: #111;
  letter-spacing: 0.01em;
}
.greedy-nav a:hover { color: #2a6e49; }
.greedy-nav .visible-links a::before { background: #2a6e49; }
.masthead__menu-item--lg a { font-weight: 700; font-size: 0.95rem; }

/* Links */
a { color: #2a6e49; }
a:visited { color: #2a6e49; }
a:hover { color: #1b4d34; }

/* Page headings */
.page__content h2 {
  font-size: 1.3rem;
  border-bottom: 2px solid #f0f0f0;
  padding-bottom: 0.4em;
  margin-top: 2.5em;
}
</style>

<!-- Support for MatJax -->
<script src="https://cdnjs.cloudflare.com/polyfill/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- Dropdown nav styles -->
<style>
.masthead__menu-item.has-dropdown { position: relative; }
.masthead__submenu {
  display: none;
  flex-direction: column;
  position: absolute;
  top: 100%;
  left: 0;
  background: #fff;
  border: 1px solid #e0e0e0;
  border-radius: 4px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.12);
  min-width: 200px;
  z-index: 200;
  padding: 0.4em 0;
  list-style: none;
  margin: 0;
}
.masthead__submenu li { display: block; width: 100%; }
.masthead__menu-item.has-dropdown:hover .masthead__submenu { display: flex; }
.masthead__submenu li a {
  display: block;
  padding: 0.45em 1.1em;
  color: #494e52;
  white-space: nowrap;
  text-decoration: none;
  font-size: 0.82em;
  font-family: inherit;
}
.masthead__submenu li a:hover { background: #f5f5f5; color: #000; }
</style>

<!-- Project hero -->
<style>
.proj-hero {
  position: relative;
  width: 100%;
  height: 73vh;
  min-height: 476px;
  background-size: cover;
  background-position: center;
  background-color: #0c1f16;
  margin-bottom: 0;
}
.proj-hero__dim {
  position: absolute;
  inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.72) 100%);
}
.proj-hero__body {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 2em 2.5em;
}
.proj-hero__title {
  font-size: clamp(1.5rem, 3.5vw, 2.6rem);
  font-weight: 800;
  color: #fff;
  margin: 0 0 1.1em;
  line-height: 1.1;
  letter-spacing: -0.03em;
}
.proj-hero__meta {
  display: flex;
  gap: 2.5em;
  flex-wrap: wrap;
  align-items: flex-start;
}
.proj-hero__meta-group { min-width: 100px; }
.proj-hero__meta-label {
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #6dd9a8;
  margin-bottom: 0.3em;
}
.proj-hero__meta-item {
  font-size: 0.82rem;
  color: rgba(255,255,255,0.88);
  line-height: 1.55;
}
</style>

<!-- Research card link fix: .archive a {text-decoration:underline} has specificity 0-1-1;
     these selectors (.archive a.CARD) have 0-2-1 and override it without !important -->
<style>
.archive a.browse-card,
.archive a.theme-card,
.archive a.status-project { text-decoration: none; }
.archive a.browse-card:hover,
.archive a.theme-card:hover,
.archive a.status-project:hover { text-decoration: none; }
.archive a.browse-card:hover .browse-card__title,
.archive a.theme-card:hover .theme-card__title,
.archive a.status-project:hover .status-project__title { text-decoration: underline; }
</style>
