      - supply-chain
      - resilience
      - environmental-security
    themes:
      - hazard-modeling
      - rural-communities
    geography:
      places:
        - "Alaska"
      regions:
        - "Alaska"
    short_description: "Examines critical infrastructure resilience across Alaska's Railbelt region — the interconnected corridor of communities, utilities, and supply networks stretching from Fairbanks to the Kenai Peninsula. A central focus is the Port of Alaska, a single point of failure for the entire state's supply chain, analyzed through infrastructure assessment, expert elicitation, and tabletop exercises to understand cascading vulnerabilities and inform mitigation investment."
    hes_contributors:
      - "Dr. Jake Hawes (PI)"
      - "Dr. Vanessa Lueck"
    collaborators:
      - "Amber Sorg and Kelly Wilson (Idaho National Laboratory)"
      - "Dr. Scott Hamel (University of Alaska Anchorage)"
    outputs:
      - label: "What counts as critical? Local definitions of critical infrastructure in Alaska"
        citation: "Lueck, V., et al. (planned). Journal TBD."
        url: ""

