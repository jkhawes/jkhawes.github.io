  - id: sovi-wildfire-wyoming
    title: "The Geography of Social Vulnerability and Wildfire Risk across Wyoming"
    status: active
    year_start: 2025
    year_end: null
    sponsor: "Unfunded (thesis research)"
    funders: []
    topics:
      - wildfire
      - social-vulnerability
      - rural-communities
      - resilience
      - computational-modeling
    themes:
      - hazard-modeling
      - social-equity
    geography:
      places:
        - "Wyoming (statewide)"
      regions:
        - "Wyoming"
    short_description: "Develops a Wyoming-specific social vulnerability index and maps it against wildfire hazard across the state's 23 counties and 132 census tracts, using local Census data and expert elicitation to capture dimensions of vulnerability that national indices like the CDC/ATSDR SVI systematically undercount in rural, resource-dependent contexts. The goal is to identify where social vulnerability and fire risk most dangerously overlap — and to give policymakers, emergency managers, and community leaders geographically targeted evidence for mitigation investment."
    hes_contributors:
      - "Dr. Jake Hawes (advisor)"
      - "Sandip Pantha (MS student)"
    collaborators: []
    outputs:
      - label: "The geography of social vulnerability and wildfire risk across Wyoming"
        citation: "Pantha, S. & Hawes, J. K. (planned). Journal TBD."
        url: ""

  - id: ai-cea
    title: "AI-Optimized Controlled Environment Agriculture"
    status: active
    year_start: 2025
    year_end: null
    sponsor: "UW AI Seed Grant"
    funders:
      - "University of Wyoming AI Seed Grant"
    topics:
      - artificial-intelligence
      - food-systems
      - urban-agriculture
      - computational-modeling
      - carbon-footprint
    themes:
      - sustainability
      - technology
    geography:
      places:
        - "Jackson Hole, WY"
        - "Denver, CO"
        - "Salt Lake City, UT"
      regions:
        - "Wyoming"
        - "Colorado"
        - "Utah"
    short_description: "Applies AI planning methods to optimize the energy use and carbon footprint of controlled environment agriculture (CEA) operations, treating the scheduling of lighting, heating, and water systems as an optimization problem that responds dynamically to grid prices, fuel mix, and weather conditions. A second phase extends this model spatially, identifying where in the Mountain West CEA is best positioned to take advantage of expanding renewable energy capacity while minimizing costs and environmental impact."
    hes_contributors:
      - "Dr. Jake Hawes (PI)"
    collaborators:
      - "Dr. Liping Wang (University of Wyoming, Director of Center for Controlled Environment Agriculture)"
      - "Dr. Shannon Albeke (WyGISC)"
    outputs:
      - label: "AI-optimized controlled environment agriculture: Compatibility with evolving renewable energy networks"
        citation: "Hawes, J. K. & Wang, L. (planned). Journal TBD."
        url: ""

  - id: ai-wyoming-by-wyoming
    title: "AI for Wyoming, By Wyoming"
    status: active
    year_start: 2026
    year_end: null
    sponsor: "Wyoming Institute for Humanities Research (Humanities for AI Seed Grant)"
    funders:
      - "Wyoming Institute for Humanities Research (Humanities for AI Seed Grant, $10,000)"
    topics:
      - artificial-intelligence
      - rural-communities
      - human-dimensions
      - scenario-planning
    themes:
      - community-resilience
      - technology
    geography:
      places:
        - "Wyoming (statewide)"
      regions:
        - "Wyoming"
    short_description: "Wyoming is rapidly becoming a testing ground for AI infrastructure — data centers, smart agriculture, AI-assisted governance — yet rural residents have had little say in how these technologies arrive or what they displace. This project surveys Wyomingites' understanding of and concerns about AI, using speculative narratives and mixed methods to surface authentic community perspectives and build an evidence base for human-centered, rural-values-aligned AI development across the state."
    hes_contributors:
      - "Dr. Jake Hawes (Co-PI)"
      - "Dr. Vanessa Lueck"
    collaborators:
      - "Dr. Brandon Gellis (University of Wyoming)"
    outputs:
      - label: "Wyoming's AI infrastructure context and rural resident perspectives: A mixed-methods study"
        citation: "Hawes, Lueck & Gellis (planned). Journal TBD."
        url: ""
      - label: "Resident profiles, future narratives, and policy implications for human-centered rural AI in Wyoming"
        citation: "White paper (planned)."
        url: ""

  - id: signals-wyoming
    title: "Signals for Understanding Wyoming Water and Fire Futures"
    status: active
    year_start: 2026
    year_end: null
    sponsor: "North Central Climate Adaptation Science Center (NC CASC)"
    funders:
      - "North Central Climate Adaptation Science Center, via CU Boulder"
    topics:
      - signals
      - scenario-planning
      - wildfire
      - resilience
      - human-dimensions
      - rural-communities
      - water-systems
    themes:
      - hazard-modeling
      - community-resilience
    geography:
      places:
        - "Wind River Basin, WY"
      regions:
        - "Wyoming"
    short_description: "Lays the groundwork for community-based hazard planning in Wyoming's Wind River Basin through literature synthesis, coalition building, and theory development around 'signals committees' — bodies that bring together scientific data, community knowledge, and traditional ecological knowledge to identify the conditions that should trigger adaptation responses. The longer-term goal is a sustained, community-grounded planning infrastructure for navigating water and fire futures under climate change."
    hes_contributors:
      - "Dr. Jake Hawes"
    collaborators:
      - "Dr. Mary Keller (University of Wyoming)"
      - "Dr. Tucker Furniss (University of Wyoming)"
      - "Priscilla Corbett (CU Boulder)"
    outputs:
      - label: "Sustaining signals committees: Long-term frameworks for community-based scenario planning and hazard response"
        citation: "Corbett, P., et al. (planned). Journal TBD."
        url: ""

  - id: blue-gentrification-michigan
    title: "Assessing Blue Gentrification in Michigan's Coastal Communities"
    status: active
    year_start: 2023
    year_end: null
    sponsor: "Michigan Sea Grant"
    funders:
      - "Michigan Sea Grant"
    topics:
      - gentrification
      - amenity-migration
      - governance
      - social-vulnerability
      - rural-communities
    themes:
      - social-equity
      - coastal-communities
    geography:
      places:
        - "Michigan coastal communities (46 Great Lakes shoreline communities)"
      regions:
        - "Michigan"
    short_description: "Produces the first systematic map of blue gentrification across 46 of Michigan's Great Lakes coastal communities, using household-level spatial analysis to track how waterfront proximity has driven changes in property values, wealth, and residential displacement between 2006 and 2020. A central question is whether Great Lakes Restoration Initiative (GLRI) waterfront revitalization investments have paradoxically accelerated displacement in the communities they were meant to benefit. Findings are translated into a publicly accessible MI Blue Gentrification Hotspot Tool and policy brief aimed at local, state, and federal decision-makers."
    hes_contributors:
      - "Jake Hawes (project predates UW; still ongoing)"
    collaborators:
      - "Joshua P. Newell (University of Michigan, PI)"
      - "Dimitrios Gounaridis (University of Michigan)"
      - "Matthew E. Liesch (Central Michigan University)"
      - "Laura Rubin (Healing Our Waters–Great Lakes Coalition)"
      - "Sophee Langerman (Healing Our Waters–Great Lakes Coalition)"
    outputs:
      - label: "Novel quantification of gentrification in amenity-driven coastal communities"
        citation: "Hawes, J. K., et al. (planned). Journal TBD."
        url: ""
      - label: "Michigan Blue Gentrification Policy Brief"
        citation: "Newell, J. P., et al. (planned). Healing Our Waters–Great Lakes Coalition."
        url: ""


