      - "Dr. Stefan Rahimi (University of Wyoming)"
    outputs: []

  - id: digital-twins-smart-rural-places
    title: "Digital Twins for Smart Rural Places"
    status: active
    year_start: 2025
    year_end: null
    sponsor: "Center for Rural Community Resilience and Innovation (CRCRI), University of Wyoming"
    funders:
      - "Center for Rural Community Resilience and Innovation (CRCRI), University of Wyoming"
    topics:
