    short_description: "Develops digital twin frameworks for infrastructure and services in small towns and rural communities across Wyoming, using Laramie and Afton as testbed communities. The work combines smart sensing, data integration, and computational modeling to create living simulations that help community planners and managers understand system behavior, anticipate problems, and make better-informed decisions about local infrastructure."
    hes_contributors:
      - "Dr. Jake Hawes"
      - "Dr. Vanessa Lueck"
      - "Md. Ismail Hossain"
    collaborators:
      - "Dr. Judith Njoku"
