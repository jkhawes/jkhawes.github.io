  - id: climes-jfsp
    title: "Inventory and Evaluation of Operational Fire Potential Forecasts Across Scales for Decision Support"
    status: active
    year_start: 2026
    year_end: 2029
    sponsor: "Joint Fire Science Program"
    funders:
      - "Joint Fire Science Program"
    topics:
      - wildfire
      - computational-modeling
      - methodology
      - human-dimensions
    themes:
      - hazard-modeling
      - decision-support
    geography:
      places: []
      regions: []
    short_description: "Wildfire managers rely on dozens of fire potential forecast products to guide decisions — but these tools have never been systematically cataloged or independently evaluated. This project builds a standardized, open-access inventory of existing fire potential forecast products and conducts rigorous evaluation of selected tools using the METplus verification framework, with the goal of giving practitioners clear, evidence-based guidance on which products are most reliable, under what conditions, and at what scales."
    hes_contributors:
      - "Dr. Jake Hawes (collaborator — practitioner engagement)"
    collaborators:
      - "Dr. Melissa Bukovsky (PI, University of Wyoming)"
      - "Amanda Siems-Anderson, Michelle Harrold, Lee Kessenich, Rachel McCrary (NCAR, Co-PIs)"
      - "Rajesh Kumar"
    outputs: []

  - id: coupled-hazard-modeling
    title: "Coupled Hazard Modeling for Rural and Gateway Communities"
    status: seeking-funding
    year_start: 2025
    year_end: null
    sponsor: "NSF (seeking)"
    funders: []
    topics:
      - wildfire
      - computational-modeling
      - resilience
      - human-dimensions
      - rural-communities
      - social-vulnerability
      - scenario-planning
    themes:
      - hazard-modeling
      - rural-communities
    geography:
      places:
        - "Greater Yellowstone Ecosystem, WY"
        - "Wyoming (statewide)"
      regions:
        - "Wyoming"
    short_description: "Develops coupled modeling approaches that link wildfire dynamics, atmospheric processes, and human social systems to understand how disturbance events affect rural and gateway communities in the Greater Yellowstone Ecosystem and across Wyoming. The work aims to improve the scientific basis for anticipating how cascading hazards unfold across landscapes and communities — and to translate that understanding into scenario planning and decision-support tools for managers and planners facing an increasingly dynamic fire environment."
    hes_contributors:
      - "Dr. Jake Hawes (Co-PI)"
      - "Dr. Vanessa Lueck"
    collaborators:
      - "Dr. Melissa Bukovsky (University of Wyoming)"
      - "Dr. Tucker Furniss (University of Wyoming)"
