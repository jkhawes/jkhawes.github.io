      - "Dr. Vinit Katariya"
      - "Dr. Jeff Hamerlinck"
      - "Dr. Jian Gong"
    outputs:
      - label: "PANDA: A lightweight digital twin framework for smart parking management"
        citation: "Njoku, Shukla, Katariya, Hossain & Hawes (2026). ASCE i3CE 2026, Songdo, South Korea."
