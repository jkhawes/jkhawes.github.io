projects:

  - id: urban-symbiosis
    title: "Urban Symbiosis"
    status: complete
    year_start: 2021
    year_end: 2026
    sponsor: "University of Michigan School for Environment and Sustainability"
    funders:
      - "University of Michigan School for Environment and Sustainability"
      - "University of Michigan Rackham Graduate School"
    topics:
      - circular-economy
      - urban-systems
      - resource-flows
      - governance
    themes:
      - sustainability
      - social-equity
    geography:
      places:
        - "London, UK"
      regions:
        - "United Kingdom"
    short_description: "Developed and empirically grounded the concept of urban symbiosis — the mutually beneficial, citizen-led sharing of materials and resources within cities. A London case study found that social and wellbeing outcomes frequently outweigh environmental motivations, challenging purely resource-efficiency framings of the circular economy."
    hes_contributors:
      - "Dr. Jake Hawes"
    collaborators:
      - "Dr. Benjamin Goldstein (University of Michigan)"
      - "Dr. Brandon Finn (University of Michigan)"
      - "Danielle Levy (University of Michigan)"
    outputs:
      - label: "A typology of resource circularity in cities"
        citation: "Goldstein, Levy, Hawes & Finn (2026). Resources, Conservation and Recycling, 227, 108743."
        url: "https://doi.org/10.1016/j.resconrec.2025.108743"
      - label: "The why, how, and what of urban symbiosis"
        citation: "Levy, Finn, Goldstein & Hawes (in review)."
        url: ""

  - id: ai-best-practices-ie
    title: "AI Best Practices for Industrial Ecology"
    status: active
    year_start: 2023
    year_end: null
    sponsor: "Unfunded / collaborative"
    funders: []
    topics:
      - machine-learning
      - industrial-ecology
      - methodology
      - sustainability-assessment
    themes:
      - reproducibility
      - data-science
    geography:
      places: []
      regions: []
    short_description: "Two parallel papers examine the state of machine learning in industrial ecology from complementary angles. Rankin et al. audits reproducibility across ML studies in the field, finding that best practices for transparency and replication are rarely followed. Taghdisian et al. takes a broader evaluative lens, assessing how, when, and in what ways AI is being applied well or poorly across IE research."
    hes_contributors:
      - "Dr. Jake Hawes"
      - "Nolan Reitz"
      - "Brianna Hiser"
    collaborators:
      - "Keagan H. Rankin, Jesse Ward-Bond, Shoshanna Saxe, and I. Daniel Posen (University of Toronto)"
      - "Franco Donati and Simon van Lierde (Leiden University)"
      - "Qingshi Tu (University of British Columbia)"
      - "Alireza Taghdisian and Grant Clark (McGill University)"
      - "Tamar Makov (Ben-Gurion University of the Negev)"
      - "Benjamin P. Goldstein (University of Michigan)"
    outputs:
      - label: "A call to ensure reproducibility of machine learning applications in industrial ecology"
        citation: "Rankin, Donati, Tu, Ward-Bond, Reitz, Hiser, et al. (in review). Research Square [preprint]."
        url: "https://www.researchsquare.com/article/rs-9270723/v1"
      - label: "Taking stock of the use of machine learning in industrial ecology"
        citation: "Taghdisian, Hawes, Makov, Clark & Goldstein (in review). Journal of Industrial Ecology."
        url: ""

  - id: stylized-facts-ce
    title: "Stylized Facts for the Circular Economy"
    status: active
    year_start: 2025
    year_end: null
    sponsor: "Collaborative / unfunded"
    funders: []
    topics:
      - circular-economy
      - policy
      - knowledge-synthesis
      - industrial-ecology
    themes:
      - sustainability
      - governance
    geography:
      places: []
      regions: []
    short_description: "An international synthesis effort distilling the circular economy literature into a set of empirically grounded 'stylized facts' — concise, evidence-based propositions that capture what is reliably known about CE systems. The goal is to make the state of CE knowledge accessible and actionable for policymakers, practitioners, and researchers who need to navigate a sprawling and often contradictory literature."
    hes_contributors:
      - "Dr. Jake Hawes"
    collaborators:
      - "Stefan Pauliuk (University of Freiburg, lead)"
      - "Levon Amatuni, Charles Breton, Sofie C.R. Férauge, Magdalena Filter-Pieler, Oleksandr Galychyn, Jennifer Hawkin, Fridolin Krausmann, Maud Lanau, Sina Leipold, Elena Verdolini"
      - "Luc Alaerts, Roberta Barr, Anna Barrero, Amy Brooks, Magnus Fröhling, Oliver Heidrich, Antti Jukka, Manish Kumar, Josh Manley, Prachi Ugle, Karel Van Acker, Stijn van Ewijk, Dominik Wiedenhofer"
    outputs:
      - label: "Stylized facts for the circular economy: A knowledge synthesis"
        citation: "Pauliuk, S., et al. (in preparation). Journal of Industrial Ecology."
        url: ""

  - id: glo-force
    title: "GLO-FORCE: Urban Food Systems Resilience"
    status: seeking-funding
    year_start: 2025
    year_end: null
    sponsor: "Seeking funding"
    funders: []
    topics:
      - food-systems
      - supply-chain
      - artificial-intelligence
      - critical-infrastructure
      - resilience
    themes:
      - resilience
      - social-equity
      - technology
    geography:
      places:
        - "St. Louis, MO"
      regions:
        - "Missouri"
    short_description: "Integrates blockchain, AI, and geospatial intelligence to strengthen food supply chain resilience in urban regions, with plans to pilot in St. Louis using the 2025 EF3 tornado as a real-world stress test case. The project aims to identify vulnerabilities in local food distribution and emergency response networks and develop decision-support tools for rapid recovery after disruption. Seeking funding — reach out to Jake."
    hes_contributors:
      - "Dr. Jake Hawes (Co-PI)"
    collaborators:
      - "Dr. Vijay Anand (Kennesaw State University, PI)"
      - "Dr. Kate Trout and Dr. Haitao Li (University of Missouri)"
      - "KC Kroll (Earth Daily)"
      - "Carlton Adams (Operation Food Search)"
      - "Taylor Geospatial Institute"
    outputs: []

  - id: few-meter
    title: "FEW-Meter"
    status: complete
    year_start: 2018
    year_end: 2024
    sponsor: "JPI Urban Europe / SUGI FWE Nexus"
    funders:
      - "ESRC, UK (ES/S002170/2)"
      - "BMBF, Germany (01LF1801A)"
      - "ANR, France (ANR-17-SUGI-0001-01)"
      - "NSF Belmont Forum, USA (18929627)"
      - "National Science Centre, Poland (2017/25/Z/HS4/03048)"
      - "European Union Horizon 2020 (GA No 730254)"
    topics:
      - urban-agriculture
      - food-systems
      - carbon-footprint
      - sustainability-assessment
    themes:
      - sustainability
      - food-energy-water-nexus
    geography:
      places:
        - "New York City, NY"
        - "London, UK"
        - "Paris, France"
        - "Dortmund, Germany"
        - "Nantes, France"
        - "Gorzów Wielkopolski, Poland"
      regions:
        - "New York"
        - "United Kingdom"
        - "France"
        - "Germany"
        - "Poland"
    short_description: "Measured the food, energy, and water flows of urban farms across five countries in Europe and North America, establishing a rigorous empirical foundation for evaluating the environmental performance of urban agriculture. The project developed and applied a standardized accounting methodology — the FEW-Meter tool — to enable cross-site comparison at a scale not previously attempted in the field."
    hes_contributors:
      - "Dr. Jake Hawes"
    collaborators:
      - "Dimitrios Gounaridis and Joshua P. Newell (University of Michigan)"
      - "Benjamin P. Goldstein (University of Michigan)"
      - "Silvio Caputo"
      - "Nevin Cohen"
      - "Agnès Fargue-Lelièvre"
      - "Lidia Poniży"
      - "Kathrin Specht"
      - "Erica Dorr"
      - "Victoria Schoen"
    outputs:
      - label: "Comparing the carbon footprints of urban and conventional agriculture"
        citation: "Hawes, Goldstein, Newell, et al. (2024). Nature Cities, 1–10."
        url: "https://doi.org/10.1038/s44284-023-00023-3"
      - label: "Assessing the potential to scale-up urban agriculture in the Global North"
        citation: "Hawes, Gounaridis, Newell, et al. (2026). Landscape and Urban Planning, 272, 105657."
        url: "https://doi.org/10.1016/j.landurbplan.2026.105657"
      - label: "Food production and resource use of urban farms and gardens: A five-country study"
        citation: "Dorr, Hawes, Goldstein, et al. (2023). Agronomy for Sustainable Development, 43(1), 18."
        url: "https://doi.org/10.1007/s13593-022-00859-4"
      - label: "What do we really know about urban agriculture's impact on people, places, and the planet?"
        citation: "Fargue-Lelièvre, Hawes, Goldstein, Poniży & Dorr (2024). Bulletin of the Atomic Scientists, 80(3)."
        url: "https://www.tandfonline.com/doi/abs/10.1080/00963402.2024.2339125"
      - label: "The role of urban agriculture in food-energy-water nexus policies"
        citation: "Fox-Kämper, Kirby, Specht, et al. (2023). Landscape and Urban Planning, 239, 104848."
        url: "https://doi.org/10.1016/j.landurbplan.2023.104848"
      - label: "Applying the food-energy-water nexus approach to urban agriculture"
        citation: "Caputo, Schoen, Specht, et al. (2020). Urban Forestry & Urban Greening, 126934."
        url: "https://doi.org/10.1016/j.ufug.2020.126934"
      - label: "FEW-Meter Final Report"
        citation: "Caputo, Dorr, Fox-Kämper, et al. (2022). Zenodo."
        url: "https://doi.org/10.5281/zenodo.6558032"
      - label: "Roadmap to Resource Efficient Urban Agriculture"
        citation: "Fox-Kämper, Specht, Caputo, et al. (2022). Zenodo."
        url: "https://zenodo.org/record/6622125"

  - id: arcap
    title: "ARCAP — Alaska Railbelt Critical Assets Project"
    status: active
    year_start: 2025
    year_end: null
    sponsor: "ADAC-ARCTIC Center of Excellence (Department of Homeland Security)"
    funders:
      - "ADAC-ARCTIC Center of Excellence (Department of Homeland Security)"
    topics:
